// Contrat gRPC partagé : génère les classes Java (messages + stubs) depuis le .proto.
plugins {
    id 'java-library'
    id 'com.google.protobuf'
}

description = 'Contrat gRPC recipe.v1'

dependencies {
    api platform("org.springframework.grpc:spring-grpc-dependencies:${springGrpcVersion}")
    api 'io.grpc:grpc-protobuf'
    api 'io.grpc:grpc-stub'
    api "com.google.protobuf:protobuf-java:${protobufVersion}"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53' // @javax.annotation.Generated
}

protobuf {
    // Binaires récents : disponibles en osx-aarch_64 et linux-aarch_64.
    protoc { artifact = "com.google.protobuf:protoc:${protobufVersion}" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}
