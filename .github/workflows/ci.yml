name: CI

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io/aissiuuuu
  K8S_VERSION: 1.34.0
  KUBECONFORM_VERSION: v0.8.0

jobs:
  backend:
    name: Build & tests Java (Gradle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.4.1
      # Docker est disponible sur le runner : le test Testcontainers PostgreSQL s'exécute.
      - run: ./gradlew build --no-daemon

  frontend:
    name: Build & tests front (Vite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  manifests:
    name: Validation des manifests (kubeconform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Installer kubeconform
        run: |
          curl -sSLo kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kc.tgz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Valider les overlays dev et cloud
        run: |
          for o in dev cloud; do
            # Secret factice : seul le format est validé, jamais déployé.
            printf 'DB_USER=ci\nDB_PASSWORD=ci\n' > k8s/overlays/$o/db-credentials.env
            kubectl kustomize k8s/overlays/$o | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -kubernetes-version "$K8S_VERSION" -
          done

  images:
    name: Images multi-arch (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, manifests]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: pantry-service, context: ., file: pantry-service/Dockerfile }
          - { name: recipe-service, context: ., file: recipe-service/Dockerfile }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Version depuis le tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Construction locale (amd64) puis scan : on ne publie pas une image vulnérable.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ env.REGISTRY }}/fridge-${{ matrix.name }}:scan
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/fridge-${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/fridge-${{ matrix.name }}:${{ env.VERSION }}
