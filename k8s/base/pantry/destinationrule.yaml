apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: pantry-service
spec:
  host: pantry-service.fridge-rescue.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
