# Une identité par workload : c'est elle que porte le certificat mTLS SPIFFE
# (spiffe://cluster.local/ns/fridge-rescue/sa/<nom>) et qu'utilisent les AuthorizationPolicy.
# Aucun workload n'appelle l'API Kubernetes : pas de jeton monté.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pantry-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recipe-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
automountServiceAccountToken: false
