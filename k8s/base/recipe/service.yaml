apiVersion: v1
kind: Service
metadata:
  name: recipe-service
  labels:
    app: recipe-service
spec:
  selector:
    app: recipe-service
  ports:
    - name: grpc            # Istio traite le trafic en HTTP/2 gRPC
      appProtocol: grpc
      port: 9090
      targetPort: grpc
    - name: http-monitoring
      port: 8081
      targetPort: http-monitoring
