apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pantry-service
  namespace: fridge-rescue
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pantry-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recipe-service
  namespace: fridge-rescue
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: recipe-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
