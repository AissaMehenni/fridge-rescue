apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-service
spec:
  template:
    spec:
      topologySpreadConstraints:
        # Répartit les répliques sur les zones pour survivre à la perte d'une zone.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: recipe-service }
