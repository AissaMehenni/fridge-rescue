# Overlay minikube : images publiées sur Docker Hub, versions figées.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: aissiuuuu/fridge-pantry-service
    newTag: 0.4.0
  - name: aissiuuuu/fridge-recipe-service
    newTag: 0.4.0
# Secret généré depuis un fichier local non versionné (make secrets).
secretGenerator:
  - name: pantry-db-credentials
    namespace: fridge-rescue
    envs:
      - db-credentials.env
generatorOptions:
  disableNameSuffixHash: false   # le hash force le redémarrage des pods si le secret change
