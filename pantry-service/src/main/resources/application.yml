spring:
  application:
    name: pantry-service
  datasource:
    # Base en mémoire par défaut (palier "in memory") ; surchargée par le profil postgres.
    url: jdbc:h2:mem:pantry;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  grpc:
    client:
      channels:
        recipes:
          # Surchargé dans Kubernetes : static://recipe-service:9090
          address: ${RECIPE_SERVICE_ADDRESS:static://localhost:9090}
          negotiation-type: plaintext
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

fridge:
  demo-data: true
  recipes:
    deadline: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
