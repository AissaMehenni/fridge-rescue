spring:
  application:
    name: pantry-service
  # Sans profil : H2 embarquée en mémoire (nom unique généré par Spring Boot).
  # Profil "postgres" (Kubernetes) : voir plus bas.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma appartient à Flyway
  flyway:
    locations: classpath:db/migration
  grpc:
    client:
      channels:
        recipes:
          # Surchargé dans Kubernetes : static://recipe-service:9090
          address: ${RECIPE_SERVICE_ADDRESS:static://localhost:9090}
          negotiation-type: plaintext
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

fridge:
  demo-data: true
  recipes:
    deadline: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

---
# Profil Kubernetes : PostgreSQL. Identifiants injectés depuis un Secret.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:pantry}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
